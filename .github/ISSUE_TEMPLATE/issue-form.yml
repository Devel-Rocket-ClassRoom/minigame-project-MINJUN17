name: "🛠 이슈 생성"
description: "새로운 기능, 버그 수정, 리팩토링 등을 위한 이슈를 생성합니다."
title: '[Label] 이슈 제목'
body:
  - type: dropdown
    id: type
    attributes:
      label: 📌 작업 타입
      description: 이슈에 가장 적합한 라벨을 하나 선택해주세요.
      options:
        - Feature (새로운 기능 추가)
        - Bug (버그 수정)
        - Refactor (코드 개선)
        - Chore (기타 작업)
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📄 상세 내용 (Description)
      description: 이슈에 대한 구체적인 설명을 작성해주세요.
      placeholder: 자세히 적을수록 좋습니다!
    validations:
      required: true
      
  - type: textarea
    attributes:
      label: ✅ 할 일 (Checklist)
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true
