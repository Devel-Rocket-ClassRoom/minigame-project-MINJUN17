name: 🐞 버그 제보
description: 게임에서 발생한 버그/오류를 제보합니다
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 일어났나요?
      description: 어떤 버그인지 설명해주세요
      placeholder: 예) 손님이 픽업대에서 멈춰서 안 움직여요
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 어떻게 하면 다시 발생하나요?
      placeholder: |
        1. 게임 시작
        2. 직원 배치
        3. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 게임 버전
      placeholder: 예) v1.0.0
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷 / 로그 (선택)
      description: 이미지나 에러 로그가 있으면 첨부해주세요
    validations:
      required: false
