name: Move assigned issue to In Progress

on:
  issues:
    types: [assigned]

jobs:
  move-to-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwDODykJwc4BXzPH";
            const statusFieldId = "PVTSSF_lADODykJwc4BXzPHzhS9n2c";
            const inProgressOptionId = "47fc9ee4";
            const issueNodeId = context.payload.issue.node_id;

            const result = await github.graphql(`
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `, { issueId: issueNodeId });

            const items = result.node.projectItems.nodes;
            const projectItem = items.find(item => item.project.id === projectId);

            if (!projectItem) {
              console.log("이슈가 프로젝트에 없습니다.");
              return;
            }

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId,
              itemId: projectItem.id,
              fieldId: statusFieldId,
              optionId: inProgressOptionId
            });

            console.log("In Progress로 이동 완료");
